<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Minimax game tree</title><desc id="d">A maximizing root chooses among three minimizing opponent responses. Terminal or horizon scores propagate upward as maximum and minimum.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f2f4f1}.n{fill:#172831;stroke:#d6ff63;stroke-width:2}.leaf{fill:#283332;stroke:#ff6d58;stroke-width:2}.edge{stroke:#718187;stroke-width:2}.label{fill:#d6ff63;font-weight:bold}</style></defs><rect width="760" height="360" rx="18" fill="#101820"/><text x="40" y="42" class="label" font-size="16">MAX: AI chooses the highest child score</text><circle class="n" cx="380" cy="90" r="28"/><text x="380" y="96" text-anchor="middle" font-size="15">MAX</text><g class="edge"><path d="M365 116 180 190M380 118v65M395 116l185 74"/><path d="M168 219 95 290M180 222v68M192 219l73 71M368 219l-73 71M380 222v68M392 219l73 71M568 219l-73 71M580 222v68M592 219l73 71"/></g><g><circle class="n" cx="180" cy="200" r="24"/><circle class="n" cx="380" cy="200" r="24"/><circle class="n" cx="580" cy="200" r="24"/><text x="180" y="205" text-anchor="middle" font-size="12">MIN</text><text x="380" y="205" text-anchor="middle" font-size="12">MIN</text><text x="580" y="205" text-anchor="middle" font-size="12">MIN</text></g><g><circle class="leaf" cx="95" cy="300" r="18"/><circle class="leaf" cx="170" cy="300" r="18"/><circle class="leaf" cx="265" cy="300" r="18"/><circle class="leaf" cx="295" cy="300" r="18"/><circle class="leaf" cx="380" cy="300" r="18"/><circle class="leaf" cx="465" cy="300" r="18"/><circle class="leaf" cx="495" cy="300" r="18"/><circle class="leaf" cx="580" cy="300" r="18"/><circle class="leaf" cx="665" cy="300" r="18"/><text x="95" y="306" text-anchor="middle">6</text><text x="170" y="306" text-anchor="middle">3</text><text x="265" y="306" text-anchor="middle">5</text><text x="295" y="306" text-anchor="middle">2</text><text x="380" y="306" text-anchor="middle">4</text><text x="465" y="306" text-anchor="middle">1</text><text x="495" y="306" text-anchor="middle">7</text><text x="580" y="306" text-anchor="middle">0</text><text x="665" y="306" text-anchor="middle">8</text></g><text x="380" y="345" text-anchor="middle" fill="#96a4a7" font-family="Arial" font-size="13">MIN nodes choose lowest child; leaf values come from terminal utility or cutoff heuristic.</text></svg>
