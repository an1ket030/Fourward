<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Alpha-Beta pruning example</title><desc id="d">At a MIN node, first child has score 4 while ancestor alpha is 6, so beta is at most 4 and remaining branches cannot affect root choice.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f2f4f1}.node{fill:#172831;stroke:#d6ff63;stroke-width:2}.edge{stroke:#879398;stroke-width:2}.pruned{stroke:#ff6d58;stroke-width:5;stroke-dasharray:8 6}</style></defs><rect width="760" height="340" rx="18" fill="#101820"/><circle class="node" cx="380" cy="70" r="30"/><text x="380" y="76" text-anchor="middle" font-size="16">MAX</text><text x="430" y="63" fill="#d6ff63" font-size="13">α = 6</text><path class="edge" d="M362 95 245 170M398 95l117 75"/><circle class="node" cx="245" cy="190" r="28"/><text x="245" y="196" text-anchor="middle" font-size="15">MIN</text><text x="282" y="182" font-size="13">β ≤ 4</text><path class="edge" d="M230 215 180 280"/><path class="pruned" d="M260 215 320 280M265 205 410 280M260 180 510 280"/><circle cx="180" cy="286" r="20" fill="#283332" stroke="#d6ff63" stroke-width="2"/><text x="180" y="292" text-anchor="middle">4</text><text x="322" y="307" fill="#ff6d58" font-size="14">remaining children pruned</text><circle class="node" cx="515" cy="190" r="28"/><text x="515" y="196" text-anchor="middle" font-size="15">MAX</text><text x="380" y="335" text-anchor="middle" fill="#96a4a7" font-size="13">Because β ≤ α, the MAX ancestor keeps its already-known 6; the 4-bound branch cannot improve it.</text></svg>
