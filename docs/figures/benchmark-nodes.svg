<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Search nodes in the saved FOURWARD benchmark</title><desc id="desc">Aggregate node visits for three positions. At depth four Minimax visited 7,959 nodes and Alpha-Beta visited 2,371. At depth six Minimax visited 357,760 and Alpha-Beta visited 24,130.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf2ee}.muted{fill:#91a2a7;font-size:13px}.axis{stroke:#41535b;stroke-width:1}.mini{fill:#ff6d58}.ab{fill:#d6ff63}.label{font-size:14px}.value{font:12px Consolas,'Courier New',monospace}</style></defs><rect width="900" height="360" rx="20" fill="#101820"/><text x="36" y="40" font-size="19" font-weight="700">Search effort · three fixed positions</text><text class="muted" x="36" y="64">Node visits summed from one saved run · Node v22.14.0 · counts are observed, not universal</text><g transform="translate(180 105)"><text x="0" y="0" font-size="15" font-weight="700">Depth 4</text><line class="axis" x1="0" y1="28" x2="650" y2="28"/><text class="label" x="0" y="59">Minimax</text><rect class="mini" x="105" y="43" width="650" height="18" rx="4"/><text class="value" x="765" y="57">7,959</text><text class="label" x="0" y="91">Alpha-Beta</text><rect class="ab" x="105" y="75" width="193.7" height="18" rx="4"/><text class="value" x="309" y="89">2,371</text><text x="0" y="140" font-size="15" font-weight="700">Depth 6</text><line class="axis" x1="0" y1="168" x2="650" y2="168"/><text class="label" x="0" y="199">Minimax</text><rect class="mini" x="105" y="183" width="650" height="18" rx="4"/><text class="value" x="765" y="197">357,760</text><text class="label" x="0" y="231">Alpha-Beta</text><rect class="ab" x="105" y="215" width="43.8" height="18" rx="4"/><text class="value" x="159" y="229">24,130</text><text class="muted" x="0" y="278">Node totals per three positions; each depth row pair uses its own scale.</text></g></svg>
