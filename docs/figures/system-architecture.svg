<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">FOURWARD system architecture</title><desc id="d">Browser UI submits state to the game controller, which uses rule engine and AI search module worker. Results update metrics; local storage saves settings and record.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#f2f4f1}.box{fill:#172831;stroke:#d6ff63;stroke-width:2}.sub{fill:#96a4a7;font-size:14px}.head{font-weight:bold;font-size:18px}.arrow{stroke:#d6ff63;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d6ff63"/></marker></defs><rect width="900" height="420" rx="20" fill="#101820"/><rect class="box" x="40" y="65" width="210" height="100" rx="12"/><text class="head" x="145" y="105" text-anchor="middle">Browser UI</text><text class="sub" x="145" y="132" text-anchor="middle">Board · controls · AI Lab</text><rect class="box" x="345" y="65" width="210" height="100" rx="12"/><text class="head" x="450" y="105" text-anchor="middle">Game controller</text><text class="sub" x="450" y="132" text-anchor="middle">Authoritative match state</text><rect class="box" x="650" y="45" width="210" height="100" rx="12"/><text class="head" x="755" y="86" text-anchor="middle">Rules + evaluator</text><text class="sub" x="755" y="113" text-anchor="middle">Rules · utility · heuristics</text><rect class="box" x="650" y="220" width="210" height="100" rx="12"/><text class="head" x="755" y="261" text-anchor="middle">Search Worker</text><text class="sub" x="755" y="288" text-anchor="middle">Minimax · Alpha-Beta</text><rect x="345" y="245" width="210" height="75" rx="12" fill="#172831" stroke="#42545c" stroke-width="2"/><text class="head" x="450" y="276" text-anchor="middle">Local storage</text><text class="sub" x="450" y="300" text-anchor="middle">Record · preferences</text><path class="arrow" d="M250 115h88"/><path class="arrow" d="M555 100h88"/><path class="arrow" d="M555 140c45 0 45 130 88 130"/><path class="arrow" d="M650 300c-55 80-95 15-95-5"/><path class="arrow" d="M345 280c-70 0-80-70-80-90"/><text class="sub" x="450" y="385" text-anchor="middle">Worker returns chosen move + measured metrics; UI renders from the shared game state.</text></svg>
